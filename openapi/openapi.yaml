openapi: 3.0.3
info:
  title: Space Data Escrow Evidence Chain API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: OK
  /readyz:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Ready
  /version:
    get:
      summary: Build version metadata
      responses:
        '200':
          description: Version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              examples:
                sample:
                  value:
                    version: 0.2.0
                    commit: abc123
                    build_date: '2026-05-19'
  /v1/evidence:
    post:
      summary: Create evidence record
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvidenceRequest'
            examples:
              sample:
                value:
                  external_id: EXT-2026-001
                  source: satellite-a
                  type: imagery
                  payload:
                    file: image-001.tif
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/evidence/{id}:
    get:
      summary: Get evidence record
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceRecord'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/custody:
    post:
      summary: Append custody event
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodyEvent'
      responses:
        '202':
          description: Accepted
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/verify/{id}:
    post:
      summary: Verify evidence chain
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReport'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReport'
  /v1/search:
    get:
      summary: Search evidence
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvidenceRecord'
  /v1/audit:
    get:
      summary: Get audit entries
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    APIError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [error]
    VersionResponse:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
      required: [version, commit, build_date]
    CreateEvidenceRequest:
      type: object
      required: [external_id, source, type, payload]
      properties:
        external_id:
          type: string
        source:
          type: string
        type:
          type: string
        payload:
          type: object
          additionalProperties:
            type: string
    EvidenceRecord:
      type: object
      properties:
        id:
          type: string
        external_id:
          type: string
        source:
          type: string
        type:
          type: string
        payload:
          type: object
          additionalProperties:
            type: string
        hash:
          type: string
        created_at:
          type: string
          format: date-time
    CustodyEvent:
      type: object
      required: [evidence_id, actor, action]
      properties:
        evidence_id:
          type: string
        actor:
          type: string
        action:
          type: string
        note:
          type: string
    VerificationReport:
      type: object
      properties:
        evidence_id:
          type: string
        chain_valid:
          type: boolean
        signature_valid:
          type: boolean
        integrity_valid:
          type: boolean
        failure_reason:
          type: string
        verified_at:
          type: string
          format: date-time
        last_custody_actor:
          type: string
    AuditResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            type: string
      required: [entries]
