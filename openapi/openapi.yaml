openapi: 3.0.3
info:
  title: Space Data Escrow Evidence Chain API
  version: 0.3.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: OK
  /readyz:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Ready
  /version:
    get:
      summary: Build version metadata
      responses:
        '200':
          description: Version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /v1/evidence:
    post:
      summary: Create evidence record
      security:
        - ApiKeyAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Replays the same create request without creating duplicate evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvidenceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceRecord'
        '200':
          description: Idempotent replay returns existing evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/evidence/{id}:
    get:
      summary: Get evidence record
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceRecord'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/custody:
    post:
      summary: Append custody event
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodyEvent'
      responses:
        '202':
          description: Accepted
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/verify/{id}:
    post:
      summary: Verify evidence chain
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReport'
              examples:
                valid:
                  value:
                    evidence_id: e-1
                    chain_valid: true
                    signature_valid: true
                    integrity_valid: true
                    verified_at: '2026-05-19T12:00:00Z'
                    last_custody_actor: operator-1
                    canonical_payload: file=image-001.tif
                    computed_hash: abcdef
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReport'
              examples:
                missing:
                  value:
                    evidence_id: missing
                    chain_valid: false
                    signature_valid: false
                    integrity_valid: false
                    failure_reason: not_found
                    verified_at: '2026-05-19T12:00:00Z'
  /v1/search:
    get:
      summary: Search evidence
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [default, semantic]
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEvidenceResponse'
  /v1/enrich:
    post:
      summary: Trigger evidence enrichment job
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerEnrichmentRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentJobResponse'
        '404':
          description: Evidence not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/enrich/{job_id}:
    get:
      summary: Get enrichment job status
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentJobResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/audit:
    get:
      summary: Get audit entries
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    APIError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [error]
    VersionResponse:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
      required: [version, commit, build_date]
    CreateEvidenceRequest:
      type: object
      required: [external_id, source, type, payload]
      properties:
        external_id:
          type: string
        source:
          type: string
        type:
          type: string
        payload:
          type: object
          additionalProperties:
            type: string
    EvidenceRecord:
      type: object
      properties:
        id:
          type: string
        external_id:
          type: string
        source:
          type: string
        type:
          type: string
        payload:
          type: object
          additionalProperties:
            type: string
        hash:
          type: string
        created_at:
          type: string
          format: date-time
    CustodyEvent:
      type: object
      required: [evidence_id, actor, action]
      properties:
        evidence_id:
          type: string
        actor:
          type: string
        action:
          type: string
        timestamp:
          type: string
          format: date-time
        note:
          type: string
    VerificationReport:
      type: object
      properties:
        evidence_id:
          type: string
        chain_valid:
          type: boolean
        signature_valid:
          type: boolean
        integrity_valid:
          type: boolean
        failure_reason:
          type: string
        verified_at:
          type: string
          format: date-time
        last_custody_actor:
          type: string
        canonical_payload:
          type: string
        computed_hash:
          type: string
    AuditResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            type: string
      required: [entries]
    ListEvidenceResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRecord'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required: [items, page, page_size, total]
    TriggerEnrichmentRequest:
      type: object
      required: [evidence_id]
      properties:
        evidence_id:
          type: string
    EnrichmentJobResponse:
      type: object
      properties:
        id:
          type: string
        evidence_id:
          type: string
        status:
          type: string
        output:
          type: object
          additionalProperties:
            type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, evidence_id, status, created_at, updated_at]
