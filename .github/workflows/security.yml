name: Security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go list -m all

  owasp-robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install robotframework robotframework-requests
      - name: Start API
        run: |
          APP_API_KEY=dev-api-key go run ./cmd/api &
          sleep 5
      - run: robot tests/robot/owasp
