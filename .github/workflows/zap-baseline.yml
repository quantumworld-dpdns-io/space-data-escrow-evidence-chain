name: ZAP Baseline

on:
  workflow_dispatch:
  pull_request:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Start API
        run: |
          APP_API_KEY=dev-api-key go run ./cmd/api &
          sleep 5
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          fail_action: true
