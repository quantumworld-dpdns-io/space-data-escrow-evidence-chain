name: Changelog

on:
  workflow_dispatch:
  pull_request:

jobs:
  draft-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate changelog draft
        run: |
          mkdir -p artifacts
          echo "# Changelog Draft" > artifacts/CHANGELOG_DRAFT.md
          git log --pretty=format:'- %h %s' -n 50 >> artifacts/CHANGELOG_DRAFT.md
      - name: Upload draft
        uses: actions/upload-artifact@v4
        with:
          name: changelog-draft
          path: artifacts/CHANGELOG_DRAFT.md
