apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: suspicious-exec-detection
spec:
  kprobes:
    - call: "sys_execve"
      syscall: true
      selectors:
        - matchBinaries:
            - operator: "Prefix"
              values:
                - "/bin/sh"
                - "/usr/bin/curl"
                - "/usr/bin/wget"
