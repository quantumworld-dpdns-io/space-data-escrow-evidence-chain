name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: gofmt check
        run: |
          test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go mod tidy
      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  benchmark-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Start API
        run: |
          APP_API_KEY=dev-api-key go run ./cmd/api &
          sleep 5
      - name: Run benchmark smoke
        run: |
          API_KEY=dev-api-key ITERATIONS=15 MAX_P95_MS=700 bash scripts/perf/benchmark_smoke.sh http://localhost:8080

  openapi-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI syntax
        run: |
          python - <<'PY'
          import yaml
          with open('openapi/openapi.yaml', 'r', encoding='utf-8') as f:
              yaml.safe_load(f)
          print('openapi yaml parse ok')
          PY

  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install robotframework robotframework-requests
      - name: Start API
        run: |
          APP_API_KEY=dev-api-key go run ./cmd/api &
          sleep 5
      - name: Run Robot suites
        run: robot tests/robot/suites tests/robot/owasp
