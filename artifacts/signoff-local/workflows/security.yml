name: Security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Dependency graph
        run: go list -m all

  go-vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  runtime-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime event schema exists
        run: test -f security/events/runtime_event_schema.json
      - name: Validate tetragon policies exist
        run: |
          test -f security/tetragon/policy-suspicious-exec.yaml
          test -f security/tetragon/policy-egress-anomaly.yaml

  secrets-and-dast-owasp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Basic secret-pattern scan
        run: |
          ! rg -n "(AKIA[0-9A-Z]{16}|BEGIN PRIVATE KEY|password\s*=\s*['\"])" .
      - run: pip install robotframework robotframework-requests
      - name: Start API
        run: |
          APP_API_KEY=dev-api-key go run ./cmd/api &
          sleep 5
      - name: Run DAST-lite script
        run: API_KEY=dev-api-key bash scripts/security/dast_lite.sh http://localhost:8080
      - name: Run OWASP robot suite
        run: robot tests/robot/owasp
